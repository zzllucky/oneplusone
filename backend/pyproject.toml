[project]
name = "word-study-quiz"
version = "0.3.0"
description = "中考英语单词学习测验与错题本（后端）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 尚未适配 bcrypt 4.1+（__about__ 被移除），故锁定 4.0.x
    "bcrypt>=4.0,<4.1",
    "PyJWT>=2.8",
    "httpx>=0.27",
    # Windows / 精简镜像缺少系统时区数据库，ZoneInfo("Asia/Shanghai") 需要它
    "tzdata>=2024.1",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: 单元测试（纯函数 / 组件级逻辑）",
    "contract: 契约测试（按 contracts/api.md 校验状态码与字段）",
    "integration: 集成测试（真实 SQLite 文件 + TestClient）",
]
